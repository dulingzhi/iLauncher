[package]
name = "ilauncher-gpui"
version = "0.1.0"
edition = "2024"
description = "iLauncher GPUI frontend (P0 spike)"

[features]
# 接 ilauncher-index：LiveIndex 进程内搜索（无 Tauri 依赖的独立 crate）
ilauncher = ["dep:ilauncher-index"]
# 接 ilauncher-clipboard：剪贴板历史窗口（托盘入口）
clipboard = ["dep:ilauncher-clipboard"]

[dependencies]
# gpui-kit = umbrella（gpui-pre + platform + base + component + assets）
gpui-kit = { version = "0.6" }
global-hotkey = "0.7"
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 启动文件/目录（等价 tauri_plugin_opener，无 Tauri 依赖）
opener = "0.6"

# 更新检查（对接现行 GitHub releases latest.json 协议，见 updater.rs）
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3" }
futures = "0.3"
minisign-verify = "0.2"
base64 = "0.22"

# 插件市场：.ilp 包（zip）解压安装（对齐 src-tauri zip = "2.2"）
zip = "2.2"

# AI 助手：Markdown 块级解析（AIChat 渲染消息用，纯函数可单测）
pulldown-cmark = { version = "0.13", default-features = false }

ilauncher-index = { path = "../ilauncher-index", optional = true }
ilauncher-clipboard = { path = "../ilauncher-clipboard", optional = true }
parking_lot = "0.12"

# MFT 服务提权/进程监控（仅 Windows，与 ilauncher-index 同版本统一）
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    # RegCreateKeyExW 的 SECURITY_ATTRIBUTES 参数需要该 feature
    # （ilauncher-index 碰巧开了它，但 plain 组合不能依赖这种间接统一）
    "Win32_Security",
]

[profile.dev]
codegen-units = 16

# 加速 gpui 依赖的 debug 构建（照抄 gpui-kit 的调优）
[profile.dev.package]
taffy = { opt-level = 3 }
smol = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
