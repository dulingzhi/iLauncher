name: Release

# 推送 v* 标签自动发版（gpui 通道：cargo → NSIS → minisign → latest.json → GitHub Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS + minisign
        run: |
          choco install nsis -y
          cargo install minisign --locked
        shell: pwsh

      - name: Update version from tag
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $toml = "crates/ilauncher-gpui/Cargo.toml"
          (Get-Content $toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$version`"" |
            Set-Content $toml -NoNewline
          Write-Host "Version set to $version"
        shell: pwsh

      - name: Build release
        run: cargo build --release --manifest-path crates/ilauncher-gpui/Cargo.toml --features "ilauncher clipboard"
        shell: pwsh

      - name: Pack installer + sign
        env:
          MINISIGN_SECRET_KEY_FILE: ${{ github.workspace }}\minisign.key
        run: |
          # 私钥从 secret 还原（整份 minisign 密钥文件的 base64）
          [IO.File]::WriteAllBytes($env:MINISIGN_SECRET_KEY_FILE,
            [Convert]::FromBase64String("${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}"))
          powershell -File scripts/pack-gpui.ps1 -SkipBuild -Sign
        shell: pwsh

      - name: Generate latest.json
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $env:VERSION = $env:VERSION.TrimStart('v')
          node scripts/generate-updater-json.js $env:VERSION $env:RELEASE_TAG
        shell: pwsh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            crates/ilauncher-gpui/target/release/bundle/nsis/iLauncher_*_x64-setup.exe
            crates/ilauncher-gpui/target/release/bundle/nsis/iLauncher_*_x64-setup.exe.sig
            latest.json
