[package]
name = "ilauncher"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ilauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI self-test binary: cargo run --bin search_test -- [OPTIONS]
# Supports: --scan --query --bench --stats --monitor
# Requires: Windows + admin rights for MFT/USN access
[[bin]]
name = "search_test"
path = "src/bin/search_test.rs"

# V3 索引端到端验证: cargo run --release --bin v3_e2e -- [DRIVE] [--elevated]
# 自提权（UAC runas）+ 真实卷: 扫描 → 造 USN 变更 → catch-up → compact → 校验
[[bin]]
name = "v3_e2e"
path = "src/bin/v3_e2e.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-updater = "2.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 工具库
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bincode = "1"
arboard = "3"
base64 = "0.22"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"

# 全局热键
global-hotkey = "0.7"

# 搜索和匹配
fuzzy-matcher = "0.3"
urlencoding = "2"
rustc-hash = "2"  # 高性能哈希
rayon = "1.10"    # 并行计算

# HTTP客户端
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# 哈希和加密
md5 = "0.7"
sha2 = "0.10"

# 代码高亮
syntect = "5.2"

# 🔥 prompt.txt 技术栈：压缩索引
bumpalo = { version = "3.14", features = ["collections"] }  # Arena 分配器
roaring = "0.11"  # RoaringBitmap 压缩位图
fst = "0.4"  # FST 有限状态转换器
memmap2 = "0.9"  # 内存映射
smartstring = "1"  # 内联小字符串优化（<23 bytes 无堆分配）

# 数据库
rusqlite = { version = "0.32", features = ["bundled", "vtab", "modern_sqlite"] }
once_cell = "1.19"  # 全局懒加载单例
parking_lot = "0.12"  # 高性能锁

# 文件系统
walkdir = "2"
zip = "2.2" # ZIP 压缩/解压（插件市场）

# 命令行解析（用于 scanner/monitor 二进制）
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",  # 图标提取需要
] }
image = "0.25"  # 图标转换为 PNG
interprocess = { version = "2.2.1", features = ["tokio"] }

# 系统信息
directories = "6"
dirs = "6"
sysinfo = "0.31"

# 开机自启
auto-launch = "0.5"

