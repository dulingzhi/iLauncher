[workspace]
resolver = "2"
members = [
    "crates/ilauncher-gpui",
    "crates/ilauncher-index",
    "crates/ilauncher-clipboard",
]

# 加速 gpui 依赖的 debug 构建（从 crates/ilauncher-gpui 上移，workspace 统一生效）
[profile.dev]
codegen-units = 16

# 发布体积优化：全量 LTO + 单编译单元让链接器跨 crate 死代码消除，
# 33MB → 预期 20MB 上下（实测以构建产物为准）
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package]
taffy = { opt-level = 3 }
smol = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
